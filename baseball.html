const LP={t:null,f:false,x:0,y:0};
const lpCancel=()=>{clearTimeout(LP.t);LP.t=null};
document.addEventListener('pointerdown',e=>{LP.f=false;lpCancel();const b=e.target.closest&&e.target.closest('[data-lp]');if(!b)return;LP.x=e.clientX;LP.y=e.clientY;LP.t=setTimeout(()=>{LP.t=null;LP.f=true;if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}if(b.dataset.lpact=='edl')startEditLog(b.dataset.lp);else delG(b.dataset.lp)},600)},true);
document.addEventListener('click',e=>{if(LP.f){const b=e.target.closest&&e.target.closest('[data-lp]');if(b){e.preventDefault();e.stopPropagation();LP.f=false}}},true);
document.addEventListener('pointermove',e=>{if(LP.t&&(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10))lpCancel()},true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,lpCancel,true));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-lp]'))e.preventDefault()});
R();
</script></body></html>
